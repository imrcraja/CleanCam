name: Build CleanCam
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build mod
        run: gradle --no-daemon build
      - name: Upload remapped mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: CleanCam-Minecraft-1.20.1-alpha
          path: build/libs/*.jar
